name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Build
        run: |
          xcodebuild \
            -project Pagedrop.xcodeproj \
            -scheme Pagedrop \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            build

      - name: Test
        run: |
          xcodebuild \
            -project Pagedrop.xcodeproj \
            -scheme Pagedrop \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            test
