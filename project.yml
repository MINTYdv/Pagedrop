name: Pagedrop
options:
  bundleIdPrefix: dev.murte
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    CLANG_ANALYZER_NONNULL: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    LM_SKIP_METADATA_EXTRACTION: YES

targets:
  Pagedrop:
    type: application
    platform: macOS
    sources:
      - path: Pagedrop
        excludes:
          - Core/**
    dependencies:
      - target: PagedropCore
    info:
      path: Pagedrop/Resources/Info.plist
      properties:
        CFBundleName: Pagedrop
        CFBundleDisplayName: Pagedrop
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSUIElement: true
        NSHumanReadableCopyright: "Copyright © 2026 Lenny Murte. Released under the MIT License."
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: dev.murte.Pagedrop.page
            UTTypeDescription: Pagedrop PDF Page
            UTTypeConformsTo:
              - public.data
    entitlements:
      path: Pagedrop/Resources/Pagedrop.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.murte.Pagedrop
        PRODUCT_NAME: Pagedrop
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # A static library, so it is linked into the app's executable. A separate embedded framework
  # would be rejected at launch by the hardened runtime's library validation when ad-hoc signed.
  PagedropCore:
    type: library.static
    platform: macOS
    sources:
      - path: Pagedrop/Core
    settings:
      base:
        PRODUCT_NAME: PagedropCore
        SKIP_INSTALL: YES
        DEFINES_MODULE: YES

  PagedropTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PagedropTests
    dependencies:
      - target: PagedropCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.murte.PagedropTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Pagedrop:
    build:
      targets:
        Pagedrop: all
    test:
      targets:
        - PagedropTests
    run:
      config: Debug
    archive:
      config: Release
